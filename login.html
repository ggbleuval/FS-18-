<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17251b">
  <title>Connexion — Notre ferme</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #20271f; background: #f5f4ed; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .card { width: min(100%, 410px); border: 1px solid #e8e7dc; border-radius: 18px; background: #fffefa; padding: 34px; box-shadow: 0 18px 55px #263b2910; }
    .mark { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 15px; background: #d7e6a1; font-size: 25px; }
    .eyebrow { margin-top: 25px; color: #355b38; text-transform: uppercase; letter-spacing: .12em; font-size: 10px; font-weight: 800; }
    h1 { margin: 7px 0 0; font-size: 29px; letter-spacing: -.04em; }
    .intro { margin: 9px 0 25px; color: #788073; font-size: 13px; line-height: 1.6; }
    label { display: block; margin: 15px 0 6px; font-size: 12px; font-weight: 700; }
    input { width: 100%; border: 1px solid #e4e4d9; border-radius: 9px; outline: none; background: #fff; padding: 12px; font: inherit; font-size: 13px; }
    input:focus { border-color: #839a68; box-shadow: 0 0 0 3px #edf2e2; }
    .error { margin-top: 16px; border-radius: 8px; background: #fff0ed; color: #9b4134; padding: 10px 12px; font-size: 12px; }
    .error[hidden] { display: none; }
    button { width: 100%; margin-top: 21px; border: 0; border-radius: 9px; background: #355b38; color: #fff; padding: 13px; font: inherit; font-size: 13px; font-weight: 750; cursor: pointer; }
    button:hover { background: #233d28; }
    .foot { margin-top: 20px; color: #969b90; text-align: center; font-size: 11px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">🌾</div>
    <div class="eyebrow">Farming Simulator 18</div>
    <h1>Bienvenue à la ferme.</h1>
    <p class="intro">Connecte-toi pour retrouver les tâches et les notes partagées de votre survie.</p>
    <form action="/login" method="post">
      <label for="username">Pseudo</label>
      <input id="username" name="username" autocomplete="username" maxlength="40" required autofocus>
      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="200" required>
      <div class="error" id="error" role="alert" hidden>Identifiant ou mot de passe incorrect. Réessaie.</div>
      <button type="submit">Entrer dans la ferme</button>
    </form>
    <div class="foot">Un espace privé, réservé aux deux fermiers.</div>
  </main>
  <script>
    if (new URLSearchParams(window.location.search).has("error")) {
      document.getElementById("error").hidden = false;
    }
  </script>
</body>
</html>
